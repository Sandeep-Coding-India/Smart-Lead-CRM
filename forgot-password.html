<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Password reset | Smart Lead CRM</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page"><main class="auth-shell compact-shell"><section class="auth-card standalone-card">
  <a class="back-link" href="index.html">← Back to login</a><div class="brand-inline"><div class="brand-mark small">S</div><strong>Smart Lead CRM</strong></div>
  <h2>Reset your password</h2><p class="muted">Enter your account email and choose a new password.</p>
  <form id="resetForm" class="form-stack">
    <label>Email address<input id="resetEmail" type="email" required placeholder="you@example.com"></label>
    <label>New password<input id="resetPassword" type="password" minlength="8" required placeholder="At least 8 characters"></label>
    <label>Confirm new password<input id="resetConfirm" type="password" minlength="8" required placeholder="Re-enter new password"></label>
    <button class="btn btn-primary full" type="submit">Update password</button><p id="resetMessage" class="form-message" aria-live="polite"></p>
  </form><p class="fine-print">Demo-only reset. This is not a secure production password recovery flow.</p>
</section></main><script src="js/storage.js"></script><script src="js/auth.js"></script></body></html>
