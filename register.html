<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create account | Smart Lead CRM</title><link rel="stylesheet" href="css/style.css"></head>
<body class="auth-page">
  <main class="auth-shell">
    <section class="auth-brand"><div class="brand-mark">S</div><p class="eyebrow">YOUR SALES, ORGANIZED</p><h1>Build better<br><span>customer relationships.</span></h1><p class="muted">Keep every lead, task and opportunity in one clear workspace.</p><div class="feature-pills"><span>Simple setup</span><span>Clear pipeline</span><span>Useful insights</span></div></section>
    <section class="auth-card">
      <div class="brand-inline"><div class="brand-mark small">S</div><strong>Smart Lead CRM</strong></div>
      <h2>Create your account</h2><p class="muted">Start managing your sales in a few steps.</p>
      <form id="registerForm" class="form-stack">
        <label>Full name<input id="registerName" type="text" autocomplete="name" placeholder="Your full name" required minlength="2" maxlength="80"></label>
        <label>Email address<input id="registerEmail" type="email" autocomplete="email" placeholder="you@example.com" required></label>
        <label>Password<input id="registerPassword" type="password" autocomplete="new-password" placeholder="At least 8 characters" required minlength="8"></label>
        <label>Confirm password<input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Re-enter your password" required minlength="8"></label>
        <label class="check-label"><input type="checkbox" id="acceptTerms" required> I understand this demo stores data in my browser.</label>
        <button class="btn btn-primary full" type="submit">Create account <span>→</span></button>
        <p id="registerMessage" class="form-message" aria-live="polite"></p>
      </form>
      <p class="auth-switch">Already have an account? <a href="index.html">Sign in</a></p>
    </section>
  </main>
  <script src="js/storage.js"></script><script src="js/auth.js"></script>
</body></html>
